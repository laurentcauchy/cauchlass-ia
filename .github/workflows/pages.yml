name: Publish approved CAUCHLASS IA edition

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
  workflow_dispatch:
    inputs:
      approval:
        description: 'Confirm Laurent approved this exact edition for public publication'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.approval == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[APPROVED-LAURENT]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Stamp Laurent approval time
        run: |
          python - <<'PY'
          import json, datetime
          from pathlib import Path
          p = Path('site/data/bulletin.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['reviewer'] = 'Laurent'
          d['reviewedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - run: python scripts/validate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved edition
        id: deployment
        uses: actions/deploy-pages@v4
